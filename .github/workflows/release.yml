name: Release

# Dispara em tags `<dir>@v<versão>` (ex.: core@v1.0.0, dnd5e-2014@v1.0.0)
# ou via workflow_dispatch (republica a versão já no package.json da main).
#
# Autentica via OIDC trusted publisher — sem NPM_TOKEN, sem OTP.
# Uma vez por pacote no npmjs.com (Package → Settings → Trusted Publisher)
# ou em lote com `npm trust github` (ver README).
#   Organization or user:  flippelt
#   Repository:            gmcr-srd-systems
#   Workflow filename:     release.yml
#   Allowed actions:       npm publish

on:
  push:
    tags:
      - '*@v*'
  workflow_dispatch:
    inputs:
      package:
        description: Directory name under packages/ (e.g. dnd5e-2014, core, npcgen)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.package || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      pkg: ${{ steps.parse.outputs.pkg }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing precisa do npm CLI ≥ 11.5.1.
      - run: npm install -g npm@latest

      - name: Parse target
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pkg="${{ github.event.inputs.package }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            pkg="${tag%@v*}"
            version="${tag##*@v}"
          fi
          if [[ ! "$pkg" =~ ^[a-z0-9][a-z0-9.-]*$ ]]; then
            echo "::error::Invalid package directory '$pkg'"
            exit 1
          fi
          pkgDir="packages/$pkg"
          test -d "$pkgDir" || { echo "::error::Package directory '$pkgDir' not found"; exit 1; }
          declared=$(node -p "require('./$pkgDir/package.json').version")
          name=$(node -p "require('./$pkgDir/package.json').name")
          expected="@lippelt/srd-$pkg"
          if [ "$name" != "$expected" ]; then
            echo "::error::package.json name ($name) does not match $expected"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$declared"
            tag="$pkg@v$version"
          elif [ "$declared" != "$version" ]; then
            echo "::error::Tag version ($version) does not match package.json version ($declared) for $pkgDir"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tag $tag -> package=$pkg, version=$version"

      - name: Install
        run: npm ci

      # Builds core first so downstream packages can resolve its types.
      - name: Build core (typegen for downstream)
        run: npm run build -w packages/core

      # Builda todos: alguns pacotes (ex.: npcgen) têm testes que importam o
      # dist de outros pacotes do monorepo. Publica só o alvo mais abaixo.
      - name: Build all
        run: npm run build

      - name: Run target package tests
        run: npm test -w packages/${{ steps.parse.outputs.pkg }}

      - name: Pack check (target)
        run: npm pack --dry-run --json -w packages/${{ steps.parse.outputs.pkg }}

      # Sem NODE_AUTH_TOKEN: o npm CLI troca o OIDC do GitHub por um token
      # curto. Provenance é gerado automaticamente pelo trusted publisher.
      - name: Publish to npm
        run: npm publish -w packages/${{ steps.parse.outputs.pkg }} --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          PKG: ${{ needs.publish.outputs.pkg }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          notes="$(mktemp)"
          {
            node scripts/extract-changelog.mjs "packages/$PKG/CHANGELOG.md" "$VERSION"
            echo
            echo "npm: https://www.npmjs.com/package/@lippelt/srd-$PKG/v/$VERSION"
          } > "$notes"
          gh release create "$TAG" --title "$TAG" --notes-file "$notes"
